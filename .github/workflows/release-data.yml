name: release-data
on:
  schedule:
    - cron: '41 3 1 * *'      # the first of every month
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build a new dataset version if the data changed
        id: build
        run: |
          python3 tools/build_release.py --auto | tee out.txt
          if grep -q "no data change" out.txt; then echo "changed=no" >> "$GITHUB_OUTPUT"; else echo "changed=yes" >> "$GITHUB_OUTPUT"; echo "version=$(python3 -c "import json;print(json.load(open('dataset/latest/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"; fi
      - name: Commit, tag and publish the release
        if: steps.build.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.build.outputs.version }}"
          git config user.name "litfest-release"
          git config user.email "actions@users.noreply.github.com"
          git add dataset
          git commit -m "Dataset release $V"
          git tag "data-$V"
          git push origin HEAD "data-$V"
          (cd dataset/latest && zip -q "../litfest-guide-data-$V.zip" *.csv datapackage.json manifest.json)
          gh release create "data-$V" "dataset/litfest-guide-data-$V.zip" --title "Dataset $V" --notes "Open data under CC BY 4.0. What changed is in dataset/CHANGELOG.md. Attribution: LitFest Guide (omshivaprakash), https://omshivaprakash.github.io/litfest-speaker-guide/, CC BY 4.0, version $V."
