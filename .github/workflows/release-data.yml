name: release-data
# Publishes the open dataset: builds a new dated version when the data changed, then tags it and attaches a zip as a GitHub release.
# Also publishes any committed version that has no tag yet (for example the first one). Runs monthly, or by hand from the Actions tab.
on:
  schedule:
    - cron: '41 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build a new dataset version if the data changed
        run: python3 tools/build_release.py --auto
      - name: Commit, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json;print(json.load(open('dataset/latest/manifest.json'))['version'])")
          git config user.name "litfest-release"
          git config user.email "actions@users.noreply.github.com"
          git add dataset
          git diff --cached --quiet || git commit -m "Dataset release $V"
          if git ls-remote --exit-code --tags origin "refs/tags/data-$V" >/dev/null 2>&1; then echo "data-$V already published"; git push origin HEAD || true; exit 0; fi
          git tag "data-$V"
          git push origin HEAD "data-$V"
          (cd dataset/latest && zip -q "../litfest-guide-data-$V.zip" *.csv datapackage.json manifest.json)
          gh release create "data-$V" "dataset/litfest-guide-data-$V.zip" --title "Dataset $V" --notes "Open data under CC BY 4.0. What changed: dataset/CHANGELOG.md. Attribution: LitFest Guide (omshivaprakash), https://omshivaprakash.github.io/litfest-speaker-guide/, CC BY 4.0, version $V."
